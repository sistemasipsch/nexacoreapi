version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexacoreapi-app
    container_name: nexacoreapi_app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-nexacore}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
    depends_on:
      - db
    networks:
      - nexacore-network

  db:
    image: mysql:8.0
    container_name: nexacoreapi_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nexacore}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-root}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - nexacore-network

networks:
  nexacore-network:
    driver: bridge

volumes:
  dbdata:
